services:
  - type: web
    name: drainx-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: drainx-postgres
          property: connectionString

databases:
  - name: drainx-postgres
    plan: free
    databaseName: urbanflooding
    user: postgres
    region: singapore
